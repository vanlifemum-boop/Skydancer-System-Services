name: Website veröffentlichen

# Veröffentlicht das Repo-Wurzelverzeichnis (index.html, fonts/) auf GitHub Pages.
# enablement: true schaltet Pages beim ersten Lauf selbst ein.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Nur die Website einpacken
        run: |
          mkdir _site
          cp -r index.html fonts .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
